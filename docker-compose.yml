services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easy-python-http-server
    networks:
      - app-network

  nginx:
    image: nginxinc/nginx-unprivileged:1.31-alpine3.24
    container_name: simple-nginx
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge